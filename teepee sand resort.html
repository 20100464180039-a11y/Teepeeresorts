<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teepee Sands Resort | Luxury Beach Stay</title>
    <link href="tpsandre.css" rel="stylesheet">
</head> 
<body>

    <nav class="navbar">
        <div class="logo-container">
            <img class="logo" src="images/sands resort new logo.jpg" alt="Logo">
            <h1>TEEPEE SANDS RESORT</h1>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <p>Experience the ultimate beach getaway</p>
            <img src="images/beach resort design.jpg" alt="Resort Design" class="hero-img">
        </div>
    </header>

    <main class="container">
        <h2 class="section-title">Our Accommodations</h2>
        <div class="room-grid">
            <div class="room-card">
                <img src="images/beach resort room.jpg" alt="1 Bedroom Suite">
                <div class="room-info">
            
                </div>
            </div>

            <div class="room-card">
                <img src="images/beach resort room2.jpg" alt="2 Bedroom Suite">
                <div class="room-info">
          
                </div>
            </div>
        </div>

        <section class="booking-section">
            <div class="form-container">
                <h3>Reserve Your Stay</h3>
                <form>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="user_name" placeholder="John Doe" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Check-in Date</label>
                            <input type="date" name="booking_date" required>
                        </div>
                        <div class="form-group">
                            <label>Preferred Time</label>
                            <input type="time" name="booking_time">
                        </div>
                      </div class="form group">
                            <label>contact number </label>
                            <input type="contect number" name="contact number">
                    <button type="submit" class="submit-btn">Check Availability</button>
                </form>
            </div>
        </section>
    </main>

</body>
</html>
