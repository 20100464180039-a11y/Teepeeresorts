<header class="logo-container">
  <link href="tpluxuryre.css" rel="stylesheet">
    <div>
        <img class="lr" src="images/lr new logo.jpg" alt="Teepee Luxury Resort Official Logo">
        <h1>TEEPEE LUXURY RESORT</h1>
    </div>
</header>

<section class="visual-gallery">
    <figure>
        <img src="images/lr house.jpg" alt="Architectural overview of our luxury forest cabins">
        <figcaption></figcaption>
    </figure>
    <figure>
        <img src="images/lr room.jpg" alt="Interior view of a premium suite">
        <figcaption></figcaption>
    </figure>
    <figure>
        <img src="images/lr pool.jpg" alt="Infinity pool overlooking the forest canopy">
        <figcaption></figcaption>
    </figure>
</section>

<section class="reservation-module">
    <form>
        <h3>Plan Your Escape</h3>
        <p>Please provide your details and our resort will finalize your arrangements.</p>

        <label for="user_name">Full Name</label>
        <input type="text" id="user_name" name="user_name" placeholder="e.g. Alexander Sterling" required>

        <label for="booking_date">Preferred Arrival Date</label>
        <input type="date" id="booking_date" name="booking_date" required>

        <label for="booking_time">Anticipated Arrival Time</label>
        <input type="time" id="booking_time" name="booking_time">
        
        <label for="phone number">contact number</label>
        <input type="contact number" id="contect number" name="contact number">

        <button type="submit" class="cta-button">Check Availability</button>
    </form>
</section>
