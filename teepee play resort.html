<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teepee Play Resort | Luxury & Fun</title>
    <link href="tpplayre.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo-container">
            <img class="logo" src="images/play resort logo.jpg" alt="Teepee Play Resort Logo">
            <h1><span class="brand-name">TEEPEE PLAY RESORT</span></div></h1>
        </div>
        <ul class="nav-links">
            <li><a href="#activities">Activities</a></li>
            <li><a href="#book">Book Now</a></li>
        </ul>
    </nav>

    <header class="hero">
        <h1>Experience the Ultimate Getaway</h1>
        <p>Adventure awaits at Teepee Play Resort</p>
    </header>

    <main>
        <section id="activities" class="content-section">
            <h2>Our Activities</h2>
            <div class="image-grid">
                <img src="images/all activi.jpg" alt="Resort Activity 1">
                <img src="images/all activ2.jpg" alt="Resort Activity 2">
                <img src="images/all activi3.jpg" alt="Resort Activity 3">
                <img src="images/all acti 4.jpg" alt="Resort Activity 4">
            </div>
        </section>

        <section id="book" class="booking-container">
            <div class="booking-card">
                <h3>Reserve Your Stay</h3>
                <form>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="user_name" placeholder="John Doe" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" name="booking_date" required>
                        </div>
                        <div class="form-group">
                            <label>Preferred Time</label>
                            <input type="time" name="booking_time">
                        </div>
                    </div class="form group">
                            <label>contact number </label>
                            <input type="contect number" name="contact number">
                    <button type="submit" class="btn-submit">Confirm Booking</button>
                </form>
            </div>
        </section>
    </main>


</body>
</html>
